robot: "g1"  # Robot name, "go2", "b2", "b2w", "h1", "go2w", "g1", "h2", "as2"
robot_scene: "scene_29dof_with_camera.xml" # Relative to unitree_robots/[robot]/

domain_id: 1  # Domain id
interface: "lo" # Interface 
# DDS IDL type: -1 auto, 0 unitree_go, 1 unitree_hg. Auto selects unitree_hg for as2.
idl_type: -1

use_joystick: 1 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 0 # Virtual spring band, used for lifting h1

# A model containing a camera named "head_cam" exposes an RGB-D stream over
# TCP. Models without that camera ignore these settings.
camera_port: 5555
camera_fps: 50
camera_depth: 1
camera_textures: 0
camera_visual_groups: 1  # Render geom groups 0 and 2
# Match the native ViBe policy camera (16:9); no intermediate resize.
camera_width: 112
camera_height: 63
camera_depth_width: 112
camera_depth_height: 63
